    var f = (stepFlip ? 210 : 175) * rnd(0.93, 1.07);
    sweep(f * 1.3, f * 0.8, t, 0.05, 0.05 * v, 'sine', bus.sfx, { cut: 900, attack: 0.002, prio: 0 });
    burst(t, 0.03, 'bandpass', (stepFlip ? 1700 : 1400) * rnd(0.9, 1.1), 1.1, 0.035 * v, bus.sfx, { prio: 0 });
  }

  function sDeath(cause, big) {
    var t = now();
    if (cause === 'fall') {
      // dropped into the clouds: a soft falling sigh, no rattle
      sweep(520, 150, t, 0.5, 0.07, 'sine', bus.sfx, { cut: 1100, attack: 0.03, prio: 2 });
      burst(t, 0.3, 'lowpass', 600, 0.5, 0.025, bus.sfx, { prio: 1 });
      return;
    }
    // cracked key: a quick wooden rattle plus a low, slightly beating buzz
    var offs = [0, 0.026, 0.055, 0.092, 0.138, 0.19];
    for (var i = 0; i < offs.length; i++) {
      burst(t + offs[i], 0.03, 'bandpass', rnd(700, 2400), 2.2, 0.1 * (1 - i * 0.13), bus.sfx, { prio: 2 });
    }
    var f = rnd(92, 104);
    sweep(f, f * 0.93, t, 0.3, 0.055, 'sawtooth', bus.sfx, { cut: 520, attack: 0.012, prio: 2 });
    sweep(f * 1.059, f * 0.99, t, 0.3, 0.045, 'sawtooth', bus.sfx, { cut: 480, attack: 0.012, prio: 2 });
    sweep(f * 3.4, f * 2.9, t + 0.01, 0.14, 0.012, 'square', bus.sfx, { cut: 900, attack: 0.005, prio: 1 });
  }

  function sRespawn() {
    var t = now() + 0.02;
    sweep(330, 700, t, 0.16, 0.06, 'sine', bus.sfx, { cut: 2600, attack: 0.02, prio: 1 });
    marimba(stageRoot + 12, t + 0.1, { vel: 0.4, bright: 0.9, prio: 1, len: 0.6 });
  }

  function sCrate() {
    var t = now();
    if (t - lastCrateAt < 0.08) return;
    lastCrateAt = t;
    for (var i = 0; i < 2; i++) {
      var tt = t + i * 0.085;
      sweep(rnd(260, 300) * (i ? 0.82 : 1), 150, tt, 0.07, 0.09, 'sine', bus.sfx, { cut: 900, attack: 0.002, prio: 1 });
      burst(tt, 0.04, 'bandpass', 1100, 1, 0.07, bus.sfx, { prio: 0 });
    }
    sweep(180, 420, t + 0.18, 0.12, 0.03, 'sine', bus.sfx, { cut: 1500, attack: 0.02, prio: 0 });
  }

  function sComplete() {
    var t = now() + 0.01;
    var r = stageRoot;
    var seq = [0, 7, 12, 16];
    for (var i = 0; i < seq.length; i++) {
      marimba(r + 12 + seq[i], t + i * 0.07, { vel: 0.7 + i * 0.05, bright: 1.1, prio: 2, len: 0.7 });
    }
    sweep(mtof(r + 12), mtof(r + 24), t, 0.3, 0.03, 'sine', bus.sfx, { cut: 3000, attack: 0.05, prio: 1 });
  }

  var HANDLERS = {
    wake: function (e) { if (e.k) sWake(e.k); },
    sleep: function (e) { if (e.k) sSleep(e.k); },
    chord: function (e) { sChord(e.keys || []); },
    jump: function (e) { sJump(!!e.sprint); },
    land: function (e) { sLand(+e.s || 0); },
    step: function (e) { sStep(+e.s || 5); },
    death: function (e) { sDeath(e.cause); },
    respawn: function () { sRespawn(); },
    crateReset: function () { sCrate(); },
    complete: function () { sComplete(); }
  };

  /* ---------- melody replay ---------- */

  function planMelody(melody) {
    var n = melody ? melody.length : 0;
    if (!n) return { onsets: [], span: 0 };
    var t0 = melody[0].t;
    var span = melody[n - 1].t - t0;
    var onsets = [0];
    if (n > 1) {
      var target = clamp(span * 0.3, 1.4, 4.4);
      var gap = 0.09;
      if (span <= 0.001) {
        for (var i = 1; i < n; i++) onsets.push(i * 0.26);
      } else {
        var k = target / span;
        for (var j = 1; j < n; j++) {
          var o = (melody[j].t - t0) * k;
          if (o < onsets[j - 1] + gap) o = onsets[j - 1] + gap;
          onsets.push(o);
        }
      }
      // never longer than ~6 s whatever the input
      var last = onsets[n - 1];
      if (last > 6) { var s = 6 / last; for (var q = 0; q < n; q++) onsets[q] *= s; }
    }
    return { onsets: onsets, span: onsets[n - 1] };
  }

  function duck(seconds) {
    if (!bus) return;
    var t = now();
    duckUntil = t + seconds;
    ambLevel();
    if (duckTimer) clearTimeout(duckTimer);
    duckTimer = setTimeout(function () { duckTimer = null; duckUntil = 0; safe(ambLevel)(); }, (seconds + 0.1) * 1000);
  }

  function endDuck() {
    duckUntil = 0;
    if (duckTimer) { clearTimeout(duckTimer); duckTimer = null; }
    if (ctxOK()) ambLevel();
  }

  function stopMelody() {
    var list = melodyVoices.slice();
    for (var i = 0; i < list.length; i++) list[i].kill();
    melodyVoices.length = 0;
  }

  /* ---------- public API ---------- */

  var API = {};

  API.unlock = safe(function () {
    if (failed) return;
    if (!AC) { failed = true; return; }
    if (!ctx) {
      try { build(); } catch (e) { failed = true; ctx = null; bus = null; return; }
    }
    if (ctx.state !== 'running' && ctx.resume) { var rp = ctx.resume(); if (rp && rp.catch) rp.catch(function () {}); }
    if (stageSet && ambientOn) startPad();
  });

  API.setStage = safe(function (stage) {
    var r = stage && typeof stage.root === 'number' ? stage.root : DEFAULT_ROOT;
    stageRoot = r;
    stageSet = true;
    stopMelody();
    endDuck();
    if (ctxOK()) {
      stopPad(1.2);
      if (ambientOn) startPad();
    }
  });

  API.handle = safe(function (events, world) {
    if (!live() || !events || !events.length) return;
    var sleeps = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (!e) continue;
      if (e.t === 'sleep' && ++sleeps > 3) continue;
      var h = HANDLERS[e.t];
      if (h) safe(h)(e);
    }
    reap();
  });

  API.playMelody = safe(function (melody, rootNote) {
    var r = typeof rootNote === 'number' ? rootNote : stageRoot;
    var plan = planMelody(melody);
    var lead = 0.42;                 // lets the stage-complete flourish breathe first
    var tail = 1.5;                  // final chord body
    var total = lead + plan.span + 0.4 + tail;
    if (!live() || !plan.onsets.length) return total;
    stopMelody();
    var t = now() + lead;
    var n = Math.min(plan.onsets.length, MUSIC_CAP - 6);
    for (var i = 0; i < n; i++) {
      var note = melody[i];
      var m = r + (note.n | 0);
      var accent = i === n - 1 ? 1 : (i % 4 === 0 ? 0.92 : 0.8);
      marimba(m, t + plan.onsets[i], {
        out: bus.music, music: true, vel: accent * rnd(0.92, 1), bright: 1,
        detune: rnd(-2, 2), len: 0.95
      });
    }
    var fin = t + plan.span + 0.4;
    var chord = [r, r + 7, r + 12, r + 16, r + 19];
    for (var c = 0; c < chord.length; c++) {
      marimba(chord[c], fin + c * 0.022, {
        out: bus.music, music: true, vel: 0.85 - c * 0.05, bright: 1.1, detune: 0, len: 1.5
      });
    }
    bell(r + 24, fin + 0.1, { out: bus.music, music: true, vel: 0.55, len: 1.2 });
    swell([r, r + 7, r + 12], fin, 1.9, 0.045, bus.music, { music: true });
    duck(lead + plan.span + 0.4 + tail);
    return total;
  });

  var UI = {
    move: function (t) {
      var n = [84, 86, 88, 91, 93][(Math.random() * 5) | 0];
      marimba(n, t, { out: bus.ui, ui: true, vel: 0.34, bright: 0.7, len: 0.28, click: 0.7 });
    },
    select: function (t) {
      marimba(76, t, { out: bus.ui, ui: true, vel: 0.62, len: 0.5 });
      marimba(83, t + 0.06, { out: bus.ui, ui: true, vel: 0.7, len: 0.6 });
    },
    back: function (t) {
      marimba(79, t, { out: bus.ui, ui: true, vel: 0.5, len: 0.45 });
      marimba(72, t + 0.07, { out: bus.ui, ui: true, vel: 0.45, bright: 0.8, len: 0.5 });
    },
    start: function (t) {
      var seq = [60, 64, 67, 72];
      for (var i = 0; i < seq.length; i++) {

      }
      swell([60, 67, 72], t + 0.1, 0.8, 0.03, bus.ui, { ui: true });
    },
    pause: function (t) {
      marimba(72, t, { out: bus.ui, ui: true, vel: 0.45, bright: 0.7, len: 0.5 });
      marimba(67, t + 0.08, { out: bus.ui, ui: true, vel: 0.4, bright: 0.7, len: 0.55 });
    },
    resume: function (t) {
      marimba(67, t, { out: bus.ui, ui: true, vel: 0.42, bright: 0.8, len: 0.45 });
      marimba(72, t + 0.07, { out: bus.ui, ui: true, vel: 0.5, len: 0.55 });
    },
    'medal-gold': function (t) {
      var seq = [72, 76, 79, 84, 88];
      for (var i = 0; i < seq.length; i++) {
        marimba(seq[i], t + i * 0.085, { out: bus.ui, ui: true, vel: 0.72, bright: 1.2, len: 0.9 });
        bell(seq[i] + 12, t + i * 0.085 + 0.01, { out: bus.ui, ui: true, vel: 0.4, len: 0.8 });
      }
      var f = t + 0.5;
      [72, 79, 84, 88, 91].forEach(function (m, i) {
        bell(m, f + i * 0.02, { out: bus.ui, ui: true, vel: 0.5, len: 1.4 });
      });
      swell([60, 67, 72], f, 1.6, 0.04, bus.ui, { ui: true });
    },
    'medal-silver': function (t) {
      var seq = [72, 76, 79, 84];
      for (var i = 0; i < seq.length; i++) {
        marimba(seq[i], t + i * 0.09, { out: bus.ui, ui: true, vel: 0.62, bright: 1.05, len: 0.8 });
      }
      bell(84, t + 0.3, { out: bus.ui, ui: true, vel: 0.4, len: 1 });
      swell([60, 67], t + 0.3, 1.1, 0.025, bus.ui, { ui: true });
    },
    'medal-bronze': function (t) {
      var seq = [72, 76, 79];
      for (var i = 0; i < seq.length; i++) {
        marimba(seq[i], t + i * 0.1, { out: bus.ui, ui: true, vel: 0.55, bright: 0.9, len: 0.8 });
      }
      swell([60, 67], t + 0.2, 0.8, 0.02, bus.ui, { ui: true });
    },
    unlock: function (t) {
      burst(t, 0.03, 'bandpass', 1500, 1.2, 0.08, bus.ui, { ui: true });
      var seq = [79, 84, 91];
      for (var i = 0; i < seq.length; i++) {
        bell(seq[i], t + 0.06 + i * 0.07, { out: bus.ui, ui: true, vel: 0.55, len: 0.8 });
      }
    },
    finale: function (t) {
      var seq = [60, 64, 67, 72, 76, 79, 84];
      for (var i = 0; i < seq.length; i++) {
        marimba(seq[i], t + i * 0.11, { out: bus.ui, ui: true, vel: 0.65 + i * 0.04, bright: 1.1, len: 1 });
      }
      var f = t + seq.length * 0.11 + 0.1;
      [60, 67, 72, 76, 79, 84].forEach(function (m, i) {
        marimba(m, f + i * 0.025, { out: bus.ui, ui: true, vel: 0.8, bright: 1.1, len: 1.6 });
        bell(m + 12, f + 0.05 + i * 0.025, { out: bus.ui, ui: true, vel: 0.35, len: 1.8 });
      });
      swell([48, 55, 60, 64], f, 2.6, 0.05, bus.ui, { ui: true });
    }
  };

  API.ui = safe(function (name) {
    if (!live()) return;
    var f = UI[name];
    if (f) f(now() + 0.005);
    reap();
  });

  API.setPaused = safe(function (p) {
    paused = !!p;
    applyPause(false);
  });

  API.setMuted = safe(function (m) {
    muted = !!m;
    if (bus) {
      var t = now();
      bus.master.gain.cancelScheduledValues(t);
      bus.master.gain.setTargetAtTime(muted ? 0 : 0.85, t, 0.04);
    }
    if (muted) stopMelody();
    else if (ctxOK() && ambientOn && stageSet) startPad();
  });
  API.isMuted = function () { return muted; };

  API.setAmbient = safe(function (a) {
    ambientOn = !!a;
    if (!ctxOK()) return;
    if (ambientOn) { startPad(); ambLevel(); }
    else { stopPad(0.6); ambLevel(); }
  });
  API.isAmbient = function () { return ambientOn; };

  root.ChispaAudio = API;
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));

  /* ---------- saved progress ---------- */

  function blankSave() {
    var out = [];
    for (var i = 0; i < S.stages.length; i++) out.push({ best: null, medal: null });
    return out;
  }
  function loadSave() {
    var data = blankSave();
    var raw = null;
    try {
      raw = global.localStorage.getItem(STORE_KEY);
      S.storageOk = true;
    } catch (e) {
      S.storageOk = false;
    }
    if (!raw) return data;
    try {
      var parsed = JSON.parse(raw);
      var list = parsed && parsed.stages;
      if (Object.prototype.toString.call(list) !== '[object Array]') return data;
      for (var i = 0; i < data.length && i < list.length; i++) {
        var it = list[i] || {};
        var best = Number(it.best);
        data[i].best = it.best != null && isFinite(best) && best > 0 ? best : null;
        data[i].medal = MEDAL_RANK[it.medal] ? it.medal : null;
      }
    } catch (e) { /* corrupt entry: start fresh, overwrite on the next record */ }
    return data;
  }
  function writeSave() {
    try {
      global.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, stages: S.save }));
      S.storageOk = true;
    } catch (e) {

    }
  }
  function realUnlocked(i) { return i === 0 || !!(S.save[i - 1] && S.save[i - 1].medal); }
  function progress() {
    var out = [];
    for (var i = 0; i < S.stages.length; i++) {
      var s = S.save[i] || { best: null, medal: null };
      out.push({ best: s.best, medal: s.medal, unlocked: S.demo || realUnlocked(i) });
    }
    return out;
  }
  function record(stageIndex, time, falls) {
    var i = clampIndex(stageIndex);
    time = Number(time);
    if (!isFinite(time) || time < 0) time = 0;
    falls = Math.max(0, Math.floor(Number(falls) || 0));
    var lr = S.lastRecord;
    if (lr && lr.stageIndex === i && lr.time === time && lr.falls === falls) {
      return { medal: lr.result.medal, best: lr.result.best, isNewBest: lr.result.isNewBest };
    }
    if (!S.save.length) S.save = blankSave();
    var slot = S.save[i];
    var medal = medalFor(time, stage(i).par);
    var nextWasUnlocked = i + 1 < S.stages.length && realUnlocked(i + 1);
    var isNewBest = slot.best == null || time < slot.best - 1e-9;
    if (isNewBest) slot.best = time;
    if (!slot.medal || MEDAL_RANK[medal] > MEDAL_RANK[slot.medal]) slot.medal = medal;
    writeSave();
    var result = { medal: medal, best: slot.best, isNewBest: isNewBest };
    S.lastRecord = {
      stageIndex: i, time: time, falls: falls, result: result,
      unlocked: i + 1 < S.stages.length && !nextWasUnlocked ? i + 1 : -1

    return { medal: result.medal, best: result.best, isNewBest: result.isNewBest };

    }
    return t;
  }

  function shade(hex, f) {

  // The Clawd from the front, a little from above and to the right: every box shows its front,

  function drawClawd(g, cx, cy, s, L) {
    var D = clawdData();

    var col = findById(D.colors, L.color) || D.colors[0], acc = findById(D.accessories, L.acc) || D.accessories[0];
    var K = 0.32;
    var P = function (x, y, z) { return [cx + (x + z * K) * s, cy - (y + z * K) * s]; };

    acc.boxes.forEach(function (b) { boxes.push({ b: b, c: acc.parts[b[6]] || '#ffffff', a: b[6] === 'lens' ? 0.62 : 1 }); });

      poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], shade(o.c, 1.16));
      poly([P(x1, y0, z0), P(x1, y0, z1), P(x1, y1, z1), P(x1, y1, z0)], shade(o.c, 0.72));

  function loop(phase) {

    phase = phase || null;
    // safe to call every frame: a repeated phase is a no-op, and 'actuar' never cuts a retry flash short
    if (phase === S.loop && phase !== 'reintento') return;
    if (phase === 'actuar' && S.loopTimer) return;
    if (S.loopTimer) { clearTimeout(S.loopTimer); S.loopTimer = null; }
    if (phase === 'reintento') {

    }
    setLoop(phase || null);

  function setLoop(phase) {
    var box = S.el.loop;

    S.loop = phase;

    box.classList.toggle('is-retry', phase === 'reintento');
    if (phase === 'reintento') {
      // restart the flash even when two retries come back to back

      void box.offsetWidth;
      box.classList.add('is-flash');
    }
    for (var i = 0; i < LOOP_STEPS.length; i++) {
      var p = LOOP_STEPS[i];

      var li = S.el.loopSteps[p];

        acc -= C.dt; steps++;
        if (done || hitStop > 0) { acc = 0; break; }
      }
    }
    audio.handle(frameEvents, w);
    if (frameEvents.some((e) => e.t === 'complete')) completeStage();
    if (state.mission && w.started) { state.mission = false; ui.mission(null); }
    // A mission card reopened from the HUD closes once Clawd has been moving for a moment.
    if (!state.mission && ui.missionReopened()) {
      reopenMoveT = Math.abs(input.x) + Math.abs(input.z) > 0.2 ? reopenMoveT + dt : 0;
      if (reopenMoveT > 0.6) { reopenMoveT = 0; ui.mission(null); }
    } else reopenMoveT = 0;
    if (state.mode === 'playing') ui.hud(hudData(w));
    ui.context(state.tr); // also on the completing frame, so the assistant message lands on the board
  }
  const alpha = state.mode === 'playing' ? Math.min(1, acc / C.dt) : 1;
  const P = w.player;
  curP.fromArray(P.p);
  drawP.lerpVectors(prevP, curP, alpha);

  // Player: facing, lean, squash and stretch, flicker, trail.
  hv.set(P.v[0], 0, P.v[2]);
  const speed = hv.length();
  chispa.visible = state.mode !== 'title' && state.mode !== 'select' && state.mode !== 'finale' && state.mode !== 'boot' && playerHidden === 0;
  chispa.position.copy(drawP);
  // Moving: face the direction of travel. Idle for a moment: turn to face the camera so Clawd's eyes show.
  if (state.mode === 'clawd') facing = Math.PI + Math.sin(t * 0.6) * 0.55;
  else if (speed > 0.4) { facing = Math.atan2(-P.v[0], -P.v[2]); idleT = 0; } else if ((idleT += dt) > 1.2 && state.mode === 'playing') facing = Math.atan2(camera.position.x - drawP.x, camera.position.z - drawP.z) + Math.PI;
  let dy = facing - body.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  body.rotation.y += dy * (1 - Math.exp(-dt * 14));
  leanX += ((-P.v[2] / C.sprint) * 0.28 - leanX) * (1 - Math.exp(-dt * 10));
  leanZ += ((-P.v[0] / C.sprint) * 0.28 - leanZ) * (1 - Math.exp(-dt * 10));
  chispa.rotation.set(-leanX, 0, leanZ);
  squash.v += (1 - squash.s) * 180 * dt; squash.v *= Math.exp(-dt * 11); squash.s += squash.v * dt;
  const sy = Math.max(0.6, Math.min(1.45, reducedMotion ? 1 + (squash.s - 1) * 0.4 : squash.s)), sxz = 1 / Math.sqrt(sy);
  popIn = Math.min(1, popIn + dt * 5);
  const pop = 1 - Math.pow(1 - popIn, 3);
  body.scale.set(sxz * pop, sy * pop, sxz * pop);
  body.position.y = (sy - 1) * C.r * 0.5 + (P.g && speed < 0.3 ? Math.sin(t * 3) * 0.015 : 0);
  const flick = 0.85 + Math.sin(t * 5) * 0.08 + Math.sin(t * 9) * 0.05;
  clawdMat.emissiveIntensity = 0.3 + flick * 0.08;
  lamp.intensity = 7 + flick * 1.5;
  halo.material.opacity = 0.32 + flick * 0.08;
  // Leg scurry: alternating legs while moving on the ground.
  const run = P.g ? Math.min(1, speed / C.walk) : 0;
  legs.forEach((leg, i) => { const ph = t * (14 + speed * 2) + (i % 2 ? Math.PI : 0); leg.position.y = -0.27 + Math.max(0, Math.sin(ph)) * 0.07 * run; leg.rotation.x = Math.sin(ph) * 0.5 * run; });
  if (chispa.visible && state.mode === 'playing') {
    trailT -= dt * (speed + (P.g ? 0 : 3));
    while (trailT < 0) { trailT += reducedMotion ? 2.2 : 0.55; emit(drawP.x + (Math.random() - 0.5) * 0.15, drawP.y + 0.05 + (Math.random() - 0.5) * 0.15, drawP.z + (Math.random() - 0.5) * 0.15, { life: 0.42, size: 0.11, col: COL.amber, drag: 3, vy: 0.3 }); }
  }
  const gtop = chispa.visible ? groundTopUnder(w, drawP.x, drawP.z, drawP.y - C.r) : -Infinity;
  if (gtop > -Infinity) {
    const h = drawP.y - C.r - gtop;
    blob.visible = true; blob.position.set(drawP.x, gtop + 0.015, drawP.z);
    const s = 0.9 * Math.max(0.4, 1 - h * 0.12); blob.scale.set(s, 1, s); blob.material.opacity = Math.max(0.15, 1 - h * 0.15);
  } else blob.visible = false;

  // Steps, subagent links, error glitch, tools.
  let pending = 0, nudgeKey = null;
  for (const k of w.keys) if (!k.awake) pending++;
  if (state.mode === 'playing' && !state.intro && nudgeT > 8) {
    let bd = Infinity;
    for (const k of w.keys) if (!k.awake) { const b = k.box, d = Math.hypot((b.min[0] + b.max[0]) / 2 - P.p[0], (b.min[2] + b.max[2]) / 2 - P.p[2]); if (d < bd) { bd = d; nudgeKey = k; } }
    if (nudgeKey && (nudgeT % 1.4) < dt) { const b = nudgeKey.box; spawnRing((b.min[0] + b.max[0]) / 2, b.max[1] + 0.05, (b.min[2] + b.max[2]) / 2, 2, nudgeKey.type === 'f' ? COL.teal : nudgeKey.type === 'c' ? COL.rose : COL.amber); }
  }
  if (view) {
    view.keys.forEach((kv) => {
      const k = kv.k;
      kv.amt += ((k.awake ? 1 : 0) - kv.amt) * (1 - Math.exp(-dt * 8));
      kv.dipV += (-kv.dip * 260) * dt; kv.dipV *= Math.exp(-dt * 12); kv.dip += kv.dipV * dt;
      kv.mesh.position.y = kv.y + kv.dip * 0.06;
      kv.mat.color.copy(kv.base).lerp(COL.keyWake, kv.amt * 0.45);
      kv.mat.emissiveIntensity = kv.amt * (0.55 + Math.sin(t * 2 + k.id) * 0.06);
      kv.glow.material.opacity = kv.amt * 0.45;
      if (kv.timer) {
        // Context and subagent steps always show their clock: empty while pending, draining once done.
        const total = k.type === 'f' ? w.fadeT : w.chordT;
        const show = state.mode === 'playing' && !k.locked;
        kv.timer.visible = show;
        if (show) {
          kv.timer.quaternion.copy(camera.quaternion);
          const full = k.awake && (k.type === 'f' && k === w.player.onKey);
          kv.timer.material.uniforms.progress.value = !k.awake ? 0 : full ? 1 : Math.max(0, k.t / total);
          kv.timer.material.uniforms.alpha.value = !k.awake ? 0.45 : k.t < 1.5 && !full && !reducedMotion ? 0.6 + 0.4 * Math.sin(t * 18) : 1;
        }
      }
      // Beacon: a soft column over each pending step; the last one and a stalled player's nearest one glow harder.
      const bm = kv.beacon;
      bm.visible = state.mode === 'playing' && !k.awake;
      if (bm.visible) {
        const yaw = Math.atan2(camera.position.x - bm.position.x, camera.position.z - bm.position.z);
        bm.rotation.set(0, yaw, 0);
        const lastOne = pending === 1, nudged = nudgeKey === k;
        const pulse = nudged ? 0.6 + 0.4 * Math.sin(t * 7) : lastOne ? 0.8 + 0.2 * Math.sin(t * 4) : 1;
        bm.material.uniforms.strength.value = (lastOne ? 0.9 : nudged ? 1.0 : 0.38) * pulse;
        const wdt = bm.userData.w * (lastOne || nudged ? 1.4 : 1), hgt = lastOne || nudged ? 11 : 6;
        bm.scale.set(wdt, hgt, 1);
      }
    });
    view.threads.forEach((th) => {
      const anyAwake = th.keys.some((k) => k.awake), locked = th.keys.every((k) => k.locked || state.mode !== 'playing' && k.awake);
      th.line.material.opacity = locked ? 0.9 : anyAwake ? 0.6 + 0.4 * Math.sin(t * 10) : 0.4;
      th.line.material.color.copy(locked ? COL.amber : COL.rose);
    });
    crackFlick -= dt;
    if (crackFlick <= 0) {
      crackFlick = 0.04 + Math.random() * 0.09; crackMat.emissiveIntensity = reducedMotion ? 1.2 : 0.7 + Math.random() * 1.2;
      view.crackGlows.forEach((g) => {
        g.material.opacity = reducedMotion ? 0.45 : 0.3 + Math.random() * 0.4;
        const b = g.userData.box;
        if (state.mode === 'playing' && Math.random() < 0.5) emit(b.min[0] + Math.random() * (b.max[0] - b.min[0]), b.max[1] + 0.05, b.min[2] + Math.random() * (b.max[2] - b.min[2]), { vy: 1.2 + Math.random(), life: 0.6, size: 0.1, col: COL.errorRed, drag: 1 });
      });
    }
    if (view.cracks && !reducedMotion) { const g = Math.random() < 0.06; view.cracks.position.x = (Math.random() - 0.5) * (g ? 0.09 : 0.012); view.cracks.position.z = g ? (Math.random() - 0.5) * 0.06 : 0; }
    view.crates.forEach((m, j) => {
      const c = w.crates[j], pc = prevCrates[j] || c.p;
      m.position.set(pc[0] + (c.p[0] - pc[0]) * alpha, pc[1] + (c.p[1] - pc[1]) * alpha, pc[2] + (c.p[2] - pc[2]) * alpha);
    });
  }

  // Stage-complete replay: flash each key as its note plays, then show the result card.
  if (state.mode === 'complete' && state.sweep && view) {
    const s = state.sweep;
    s.notes.forEach((nt) => {
      if (nt.played || s.t < nt.at) return;
      nt.played = true;
      const kv = view.keys[nt.k];
      if (!kv) return;
      const b = kv.k.box, x = (b.min[0] + b.max[0]) / 2, z = (b.min[2] + b.max[2]) / 2;
      kv.dipV -= 1.4; spawnRing(x, b.max[1] + 0.05, z, 1.6, COL.amber);
      burst(x, b.max[1] + 0.2, z, 8, { speed: 2, col: COL.amber, life: 0.7, up: 1.5 });
    });
    if (state.phase === 'sweep' && s.t >= s.dur) showResult();
  }

  if (flashT > 0) { flashT -= dt; if (flashT <= 0) $('ch-flash').classList.remove('ch-on'); }
  updateParticles(dt);
  updateRings(dt);
  updateCamera(dt, drawP, hv);
  flyPapers(w);
  if (view && view.labels) placeLabels(dt, state.mode === 'playing' || state.mode === 'paused' || state.mode === 'complete');
  cloudUniforms.time.value = t;
  motes.material.uniforms.time.value = t;
  renderer.render(scene, camera);
}

function resize() {
  const wdt = window.innerWidth, hgt = window.innerHeight;
  renderer.setSize(wdt, hgt, false);
  camera.aspect = wdt / Math.max(1, hgt);
  camera.fov = camera.aspect < 0.8 ? 68 : 50;
  camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  pMat.uniforms.scale.value = hgt * pr * 0.9;
  motes.material.uniforms.scale.value = hgt * pr * 0.9;
}
window.addEventListener('resize', resize);

/* ---------------- boot ---------------- */
function start(data) {
  resize();
  backdrop(9);
  ui.init({
    root: $('ch-ui'),
    stages: STAGES,
    on: {
      play: (i) => startStage(i),
      retry: () => startStage(state.stage),
      next: () => nextStage(),
      resume: () => resumeGame(),
      pause: () => pauseGame(),
      quit: () => showSelect(),
      title: () => showTitle(),
      mute: (m) => audio.setMuted(!!m),
      clawd: (L) => applyLook(L),
      ambient: (a) => audio.setAmbient(!!a)
    },
    sfx: (name) => { audio.unlock(); audio.ui(name); }
  });
  applyLook(ui.look());
  $('ch-loading').hidden = true;
  if (!UIPart) {
    const p = document.createElement('p'); p.id = 'ch-devhint';
    p.textContent = TEXT.noUI;
    document.body.appendChild(p);
  }
  if (data && typeof data.stage === 'number' && data.mode === 'playing') startStage(data.stage);
  else showTitle();
  requestAnimationFrame((n) => { last = n; frame(n); });
}
window.claude?.hot?.snapshot?.(() => ({ stage: state.stage, mode: state.mode === 'paused' ? 'playing' : state.mode }));
window.__chispa = { state, Core, startStage, showTitle, showSelect, frames: () => frames, labelRects: () => (view && view.labelRects) || [],
  lookApplied: () => ({ color: '#' + clawdMat.color.getHexString(), dark: '#' + clawdDark.color.getHexString(), acc: accGroup.userData.id || 'ninguno', parts: accGroup.children.length, name: lookName }),
  clawdScreen: () => { const v = chispa.position.clone(); v.y += 0.1; v.project(camera); return { x: (v.x + 1) / 2 * window.innerWidth, y: (1 - v.y) / 2 * window.innerHeight, visible: chispa.visible }; } };
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
