const sunDir = new THREE.Vector3(-0.45, 0.16, -1).normalize();

const sun = new THREE.DirectionalLight(0xffc98f, 2.4);

const TONE_END = `
  #include <tonemapping_fragment>
  #include <colorspace_fragment>`;

// Sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: COL.skyTop }, mid: { value: COL.skyMid }, horizon: { value: COL.horizon }, below: { value: COL.below }, sunCol: { value: COL.sun }, sunDir: { value: sunDir } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `uniform vec3 top, mid, horizon, below, sunCol, sunDir; varying vec3 vDir;
    void main(){ float h = vDir.y;

      c = mix(c, top, smoothstep(0.24, 0.8, h));

scene.add(sky);

// Sea of clouds: one large plane with drifting fbm.
const cloudUniforms = { time: { value: 0 }, cLight: { value: COL.cloudLight }, cShadow: { value: COL.cloudShadow }, fogColor: { value: COL.fog }, camPos: { value: new THREE.Vector3() } };

  uniforms: cloudUniforms, fog: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float time; uniform vec3 cLight, cShadow, fogColor, camPos; varying vec3 vW;

      float n = fbm(p) * 0.75 + fbm(p * 2.6 - vec2(time * 0.012, 0.0)) * 0.35;
      float m = smoothstep(0.38, 0.82, n);
      vec3 c = mix(cShadow, cLight, m);
      c += vec3(1.0, 0.75, 0.55) * pow(m, 4.0) * 0.25;
      float d = length(vW.xz - camPos.xz);

scene.add(cloudSea);

// Puffy cloud clusters (one instanced draw) for depth around and under the stage.
const PUFFS = 70;
const puffs = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshLambertMaterial({ color: 0xffc9b8, emissive: 0x5e3462, emissiveIntensity: 0.45 }), PUFFS);
scene.add(puffs);

// Floating motes drifting in a shader.
function makeMotes(n) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos[i * 3] = (Math.random() - 0.5) * 60; pos[i * 3 + 1] = Math.random() * 10 - 2; pos[i * 3 + 2] = (Math.random() - 0.5) * 70; ph[i] = Math.random() * 6.28; }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('phase', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    uniforms: { time: { value: 0 }, scale: { value: 300 }, col: { value: new THREE.Color('#ffcf7a') } },
    vertexShader: `attribute float phase; uniform float time, scale; varying float vA;
      void main(){ vec3 p = position + vec3(sin(time * 0.3 + phase) * 1.2, sin(time * 0.5 + phase * 2.0) * 0.6, cos(time * 0.25 + phase) * 1.2);
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = scale * 0.09 / -mv.z; gl_Position = projectionMatrix * mv;
        vA = 0.35 + 0.35 * sin(time * 1.7 + phase * 3.0); }`,
    fragmentShader: `uniform vec3 col; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d) * vA; gl_FragColor = vec4(col, a);

    }`

scene.add(motes);

/* ---------------- procedural textures (no image files) ---------------- */
function canvasTex(size, draw, color = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const panelTex = canvasTex(256, (g, S) => {
  // Floor tiles: soft cream panels with thin seams, read as clean platforms.
  g.fillStyle = '#f4ece0'; g.fillRect(0, 0, S, S);
  const r = rnd(7);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const v = 236 + Math.floor(r() * 14);
    g.fillStyle = `rgb(${v},${v - 6},${v - 16})`; g.fillRect(i * 64 + 2, j * 64 + 2, 60, 60);

  for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64, S); g.stroke(); g.beginPath(); g.moveTo(0, k * 64); g.lineTo(S, k * 64); g.stroke(); }
});
const stepTex = canvasTex(128, (g, S) => {

  g.fillStyle = '#d9c7ad'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#ffffff';
  const rr = 18, m = 10;
  g.beginPath(); g.moveTo(m + rr, m); g.arcTo(S - m, m, S - m, S - m, rr); g.arcTo(S - m, S - m, m, S - m, rr); g.arcTo(m, S - m, m, m, rr); g.arcTo(m, m, S - m, m, rr); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(217,119,87,0.55)'; g.lineWidth = 4; g.stroke();
});
stepTex.wrapS = stepTex.wrapT = THREE.ClampToEdgeWrapping;
const crateTex = canvasTex(128, (g, S) => {
  // Tool box: terracotta case, darker lid band, two latches.
  g.fillStyle = '#c4553a'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#9c3f2a'; g.fillRect(0, 0, S, 30);
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, 30, S, 4);
  g.fillStyle = '#f2e3c9'; g.fillRect(24, 22, 16, 18); g.fillRect(S - 40, 22, 16, 18);
  g.strokeStyle = 'rgba(60,20,10,0.5)'; g.lineWidth = 4; g.strokeRect(2, 2, S - 4, S - 4);
  g.fillStyle = '#f2e3c9'; g.fillRect(S / 2 - 22, 70, 44, 26);
  g.fillStyle = '#c4553a'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.fillText('</>', S / 2, 91);

  g.fillStyle = '#2b2030'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 4) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, y, S, 2); }

const crackEmTex = canvasTex(256, (g, S) => {
  // Glitch: displaced bright bars and a warning cross, red and magenta.
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  const r = rnd(23);
  for (let k = 0; k < 26; k++) {
    g.fillStyle = k % 3 ? '#ff2e55' : k % 2 ? '#ff6ad5' : '#ff9a3a';
    g.fillRect(r() * S, r() * S, 10 + r() * 70, 2 + r() * 7);
  }
  g.strokeStyle = '#ff3d5a'; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(S * 0.36, S * 0.36); g.lineTo(S * 0.64, S * 0.64); g.moveTo(S * 0.64, S * 0.36); g.lineTo(S * 0.36, S * 0.64); g.stroke();
});
function radialTex(inner, outer) {
  const t = canvasTex(128, (g, S) => {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, inner); gr.addColorStop(0.25, inner.replace(/[\d.]+\)$/, '0.45)')); gr.addColorStop(1, outer);

const blobTex = radialTex('rgba(20,8,30,0.6)', 'rgba(20,8,30,0)');

/* ---------------- geometry helpers ---------------- */
// Box with world-scaled UVs so the grain keeps its size on every platform.
function boxData(min, max, center, uvScale = 0.5, top = null, side = null) {
  const pos = [], nor = [], uv = [], idx = [], col = [];
  const [x0, y0, z0] = min, [x1, y1, z1] = max;
  const cx = center ? center[0] : 0, cy = center ? center[1] : 0, cz = center ? center[2] : 0;
  const faces = [
    { n: [1, 0, 0], v: [[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], u: (p) => [p[2], p[1]] },
    { n: [-1, 0, 0], v: [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], u: (p) => [p[2], p[1]] },
    { n: [0, 1, 0], v: [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], u: (p) => [p[0], p[2]] },
    { n: [0, -1, 0], v: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], u: (p) => [p[0], p[2]] },
    { n: [0, 0, 1], v: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], u: (p) => [p[0], p[1]] },
    { n: [0, 0, -1], v: [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], u: (p) => [p[0], p[1]] }
  ];
  faces.forEach((f) => {
    const base = pos.length / 3;
    const c = f.n[1] > 0 ? top : side;
    f.v.forEach((p) => { pos.push(p[0] - cx, p[1] - cy, p[2] - cz); nor.push(...f.n); const t = f.u(p); uv.push(t[0] * uvScale, t[1] * uvScale); if (c) col.push(c.r, c.g, c.b); });

function geoFrom(parts) {

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  if (col.length === pos.length) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);

/* ---------------- shared materials ---------------- */
const deckMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: panelTex, vertexColors: true, roughness: 0.85 });

          Core.feedTranscript(state.tr, w.events, w);
          for (let k = n0; k < state.tr.papers.length; k++) newPapers.push(k);
        }
        for (const e of w.events) frameEvents.push(e);
        reactToEvents(w, w.events);

    } else reopenMoveT = 0;

  }
  const alpha = state.mode === 'playing' ? Math.min(1, acc / C.dt) : 1;
  const P = w.player;
  curP.fromArray(P.p);

  // Player: facing, lean, squash and stretch, flicker, trail.
  hv.set(P.v[0], 0, P.v[2]);

  chispa.position.copy(drawP);
  // Moving: face the direction of travel. Idle for a moment: turn to face the camera so Clawd's eyes show.

    while (trailT < 0) { trailT += reducedMotion ? 2.2 : 0.55; emit(drawP.x + (Math.random() - 0.5) * 0.15, drawP.y + 0.05 + (Math.random() - 0.5) * 0.15, drawP.z + (Math.random() - 0.5) * 0.15, { life: 0.42, size: 0.11, col: COL.amber, drag: 3, vy: 0.3 }); }
